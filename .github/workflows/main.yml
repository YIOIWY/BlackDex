name: Build BlackDex APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库源码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 JDK 环境（关键改动：BlackDex 项目较老，必须使用 JDK 11，用 JDK 17 会报错）
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # 3. 安装 NDK 环境（关键改动：BlackDex 包含 C/C++ 代码，必须配置安卓 NDK）
    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '21.4.7075529' # 使用标准的常用 NDK 版本即可

    # 4. 赋予 Gradle 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. 执行编译命令
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 6. 将编译好的 APK 上传（关键改动：BlackDex 会同时生成多个架构的 APK，这里打包全部）
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: blackdex-apks
        path: app/build/outputs/apk/debug/**/*.apk
